<!DOCTYPE html>
<html lang="en">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>glyphdiff</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Roboto+Condensed&family=Roboto:wght@300;400;500;700&family=Zen+Kaku+Gothic+Antique&family=Zen+Maru+Gothic&family=Material+Icons&display=swap"
  rel="stylesheet" />
<!-- <link rel="stylesheet" href="https://code.getmdl.io/1.3.0/material.indigo-pink.min.css" /> -->
<!-- <script defer src="https://code.getmdl.io/1.3.0/material.min.js"></script> -->

<link href="https://cdn.jsdelivr.net/npm/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet"
  integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


<script src="https://ajax.googleapis.com/ajax/libs/webfont/1/webfont.js"></script>
<link rel="stylesheet" href="style.css" />

<body class="mdl-color--grey-50">
  <div id="parallax">
    <div id="writepad" class="mdl-color-text--grey-900">
      <svg id="comparepad">
        <line id="baseline" x1="10%" y1="70%" x2="90%" y2="70%" class="mdl-animation--default strokeCC" />
        <text id="sample2" x="50%" y="70%"></text>
        <text id="sample1" x="50%" y="70%" class="strokeCC"></text>
        <text id="label-font1" x="48%" y="95%" class="fillCC" text-anchor="end"></text>
        <text id="label-font2" x="52%" y="95%" class="fillCC"></text>
        <!-- <text x="98%" y="95%" text-anchor="end">glyphdiff.yuki.rocks</text> -->
      </svg>
      <input type="text" id="gd-input" value="いろは" />
    </div>
    <div class="main mdl-color--grey-100">
      <div class="container">

        <ul class="nav nav-tabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#panel-fonts" type="button" role="tab">Fonts</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#panel-tunings" type="button" role="tab">Tunings</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#panel-about" type="button" role="tab">About</button>
          </li>
        </ul>

        <div class="tab-content">
          <div class="tab-pane active" id="panel-fonts" role="tabpanel">
            <div class="row">
              <div class="col-6">
                <div class="row">
                  <div class="col-7">
                    <label class="form-label" for="gd-fontfamily1">Font family</label>
                    <input id="gd-fontfamily1" class="form-control" type="text" list="preset-fonts"
                      placeholder="Zen Kaku Gothic New" />
                  </div>
                  <div class="col-5 toppad">
                    <label class="form-label" for="gd-fontweight1">Weight</label>
                    <input id="gd-fontweight1" class="form-range" type="range" min="100" max="900"
                      value="400" step="100" />
                  </div>
                  <div class="col-3">
                    <div class="form-check">
                      <input class="form-check-input" id="gd-slant-normal1" name="slant1" type="radio" value="normal" />
                      <label class="form-check-label" for="gd-slant-normal1">Normal</label>
                    </div>
                  </div>
                  <div class="col-3">
                    <div class="form-check">
                      <input class="form-check-input" id="gd-slant-italic1" name="slant1" type="radio" value="italic" />
                      <label class="form-check-label" for="gd-slant-italic1">Italic</label>
                    </div>
                  </div>
                  <div class="col-3">
                    <div class="form-check">
                      <input class="form-check-input" id="gd-slant-oblique1" name="slant1" type="radio" value="oblique" />
                      <label class="form-check-label" for="gd-slant-oblique1">Oblique</label>
                    </div>
                  </div>
                </div>
              </div>
              <div class="col-6">
                <div class="row">
                  <div class="col-7">
                    <label class="form-label" for="gd-fontfamily2">Font family</label>
                    <input id="gd-fontfamily2" class="form-control" type="text" list="preset-fonts"
                      placeholder="Zen Maru Gothic" />
                  </div>
                  <div class="col-5 toppad">
                    <label class="form-label" for="gd-fontweight2">Weight</label>
                    <input id="gd-fontweight2" class="form-range" type="range" min="100" max="900"
                      value="400" step="100" />
                  </div>
                  <div class="col-3">
                    <div class="form-check">
                      <input class="form-check-input" id="gd-slant-normal2" name="slant2" type="radio" value="normal" />
                      <label class="form-check-label" for="gd-slant-normal2">Normal</label>
                    </div>
                  </div>
                  <div class="col-3">
                    <div class="form-check">
                      <input class="form-check-input" id="gd-slant-italic2" name="slant2" type="radio" value="italic" />
                      <label class="form-check-label" for="gd-slant-italic2">Italic</label>
                    </div>
                  </div>
                  <div class="col-3">
                    <div class="form-check">
                      <input class="form-check-input" id="gd-slant-oblique2" name="slant2" type="radio" value="oblique" />
                      <label class="form-check-label" for="gd-slant-oblique2">Oblique</label>
                    </div>
                  </div>
                  <div class="col-3">
                    <button id="gd-swap" class="btn btn-outline-secondary btn-sm">
                      <i class="material-icons">swap_horiz</i>
                    </button>
                  </div>
                </div>
              </div>
            </div>
            <datalist id="preset-fonts">
              <option value="Arial" />
              <option value="Avenir Next" />
              <option value="Avenir" />
              <option value="Courier New" />
              <option value="Courier" />
              <option value="Futura" />
              <option value="Georgia" />
              <option value="Gill Sans" />
              <option value="Helvetica Neue" />
              <option value="Helvetica" />
              <option value="Impact" />
              <option value="Optima" />
              <option value="Palatino" />
              <option value="Times New Roman" />
              <option value="Verdana" />
            </datalist>
          </div>

          <div class="tab-pane" id="panel-tunings" role="tabpanel">
            <div class="row">
              <div class="col-4">
                <div class="row">
                  <div class="col-6 toppad">
                    <div class="form-check">
                      <input type="checkbox" id="gd-baseline" class="form-check-input" />
                      <label class="form-check-label" for="gd-baseline">Baseline</label>
                    </div>
                  </div>
                  <div class="col-6 toppad">
                    <div class="form-check">
                      <input type="checkbox" id="gd-darkmode" class="form-check-input" />
                      <label class="form-check-label" for="gd-darkmode">Dark mode</label>
                    </div>
                  </div>
                  <div class="col-4">
                    <input id="gd-color2" class="form-control form-control-color" type="color" />
                  </div>
                </div>
              </div>
              <div class="col-4">
                <div class="row">
                  <div class="col-12 toppad">
                    <label class="form-label" for="gd-size2">Size <span id="size2-tooltip"></span></label>
                    <input class="form-range" id="gd-size2" type="range" min="0.8" max="1.2" step="0.01" />
                  </div>
                  <div class="col-12 toppad">
                    <label class="form-label" for="gd-spacing2">Spacing <span id="spacing2-tooltip"></span></label>
                    <input class="form-range" id="gd-spacing2" type="range" min="-0.1" max="0.1" value="0"
                      step="0.01" />
                  </div>
                </div>
              </div>
              <div class="col-4">
                <div class="row">
                  <div class="col-12 toppad">
                    <label class="form-label" for="gd-translateX">Translate X <span id="translateX-tooltip"></span></label>
                    <input class="form-range" id="gd-translateX" type="range" min="-30" max="30"
                      value="0" />
                  </div>
                  <div class="col-12 toppad">
                    <label class="form-label" for="gd-translateY">Translate Y <span id="translateY-tooltip"></span></label>
                    <input class="form-range" id="gd-translateY" type="range" min="-30" max="30"
                      value="0" />
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="tab-pane" id="panel-about" role="tabpanel">
            <div class="info">
              <h1>glyphdiff</h1>
              <p>is a simple tool comparing the differences of two fonts on given glyphs.</p>
              <p>
                <a href="https://github.com/chadluo/glyphdiff">GitHub repo</a> &middot;
                <a href="https://yuki.rocks">made by chadluo</a>
              </p>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
  <div class="flt">
    <button id="gd-share" class="mdl-button mdl-js-button mdl-button--fab mdl-js-ripple-effect mdl-button--colored">
      <i class="material-icons">share</i>
    </button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="scripts/app.js"></script>
</body>

</html>
